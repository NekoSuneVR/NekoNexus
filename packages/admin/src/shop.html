<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — NekoNexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857' } } } } };
  </script>
  <style>
    body { background: radial-gradient(1200px 600px at 50% -10%, rgba(16, 185, 129, .14), transparent 60%), #0a0a0a; }
    .glass { background: rgba(23, 23, 23, .7); backdrop-filter: blur(8px); }
    .ph { background: linear-gradient(135deg, #1f2937, #111827); }
  </style>
</head>
<body class="text-neutral-200 min-h-screen">
  <header class="border-b border-neutral-800">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-xl font-bold text-brand-400">NekoNexus</a>
      <nav class="flex gap-5 text-sm text-neutral-400 items-center">
        <a href="/" class="hover:text-brand-400">Home</a>
        <a href="/leaderboard" class="hover:text-brand-400">Leaderboard</a>
        <a href="/shop" class="text-brand-400">Shop</a>
        <span id="authnav"><a href="/login" class="hover:text-brand-400">Sign in</a></span>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="needLogin" class="hidden glass rounded-xl p-8 text-center">
      <h1 class="text-2xl font-bold mb-2">Shop</h1>
      <p class="text-neutral-400 mb-5">Sign in with Steam to buy and equip items — they're shared with the game.</p>
      <a href="/login" class="inline-block px-5 py-2.5 rounded bg-brand-600 hover:bg-brand-500 text-white">Sign in</a>
    </div>

    <div id="app" class="hidden">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div class="flex gap-2 text-sm">
          <button data-tab="shop" class="tabbtn px-4 py-2 rounded bg-brand-600 text-white">Shop</button>
          <button data-tab="inventory" class="tabbtn px-4 py-2 rounded bg-neutral-800">Inventory</button>
          <button data-tab="loadout" class="tabbtn px-4 py-2 rounded bg-neutral-800">Loadout</button>
        </div>
        <div class="text-sm glass rounded-lg px-4 py-2">
          <span class="text-brand-400 font-semibold" id="walCredits">—</span> <span class="text-neutral-500">Credits</span>
          <span class="mx-2 text-neutral-700">·</span>
          <span class="text-yellow-400 font-semibold" id="walPoints">—</span> <span class="text-neutral-500">Points</span>
        </div>
      </div>

      <!-- SHOP -->
      <section data-view="shop">
        <div class="flex flex-wrap gap-2 mb-4 text-sm items-center">
          <button data-cat="weapon" class="catbtn px-3 py-1.5 rounded bg-brand-600 text-white">Weapons</button>
          <button data-cat="gear" class="catbtn px-3 py-1.5 rounded bg-neutral-800">Gear</button>
          <button data-cat="quick" class="catbtn px-3 py-1.5 rounded bg-neutral-800">Quick Use</button>
          <button data-cat="functional" class="catbtn px-3 py-1.5 rounded bg-neutral-800">Functional</button>
          <input id="shopSearch" type="search" placeholder="Search items…" class="ml-auto px-3 py-1.5 rounded bg-neutral-900 border border-neutral-700 outline-none focus:border-brand-500 text-sm w-48" />
        </div>
        <div id="shopGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>

      <!-- INVENTORY -->
      <section data-view="inventory" class="hidden">
        <div id="invGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>

      <!-- LOADOUT -->
      <section data-view="loadout" class="hidden">
        <div id="loadoutGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>
      </section>
    </div>
  </main>

  <!-- Buy dialog -->
  <div id="buyModal" class="hidden fixed inset-0 z-30 flex items-center justify-center bg-black/60 px-4">
    <div class="glass rounded-xl p-5 w-full max-w-sm border border-neutral-800">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-14 h-14 rounded ph flex items-center justify-center overflow-hidden">
          <img id="buyImg" class="w-full h-full object-contain" onerror="this.style.display='none'" />
        </div>
        <div>
          <h3 id="buyName" class="font-semibold"></h3>
          <p id="buyLock" class="text-xs text-neutral-500"></p>
        </div>
      </div>
      <p class="text-sm text-neutral-400 mb-2">Choose a price:</p>
      <div id="buyPrices" class="space-y-2"></div>
      <p id="buyMsg" class="text-sm mt-2 h-5"></p>
      <button onclick="closeBuy()" class="mt-2 w-full px-4 py-2 rounded bg-neutral-800 hover:bg-neutral-700 text-sm">Cancel</button>
    </div>
  </div>

  <!-- Equip-slot dialog (weapons / quick / functional) -->
  <div id="slotModal" class="hidden fixed inset-0 z-30 flex items-center justify-center bg-black/60 px-4">
    <div class="glass rounded-xl p-5 w-full max-w-xs border border-neutral-800">
      <h3 class="font-semibold mb-3">Equip to which slot?</h3>
      <div id="slotBtns" class="space-y-2"></div>
      <button onclick="closeSlot()" class="mt-3 w-full px-4 py-2 rounded bg-neutral-800 hover:bg-neutral-700 text-sm">Cancel</button>
    </div>
  </div>

  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const token = localStorage.getItem('nekonexus_user_token');
    let me = null;
    try { me = token ? JSON.parse(atob(token.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'))) : null; } catch (e) {}
    const authed = me && me.cmid && (!me.exp || me.exp > Date.now() / 1000);

    async function api(path, opts) {
      const o = Object.assign({ headers: {} }, opts || {});
      o.headers = Object.assign({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, o.headers);
      const r = await fetch(path, o);
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || ('HTTP ' + r.status));
      return r.json();
    }

    // Item card with image + graceful placeholder fallback.
    function imgHtml(id, name) {
      return `<div class="aspect-square ph rounded-lg flex items-center justify-center overflow-hidden mb-2 relative">
        <img src="/images/items/${id}.png" alt="${esc(name)}" class="w-full h-full object-contain"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <div class="absolute inset-0 hidden items-center justify-center text-3xl font-bold text-neutral-600">${esc((name || '?').slice(0, 1).toUpperCase())}</div>
      </div>`;
    }

    if (!authed) {
      document.getElementById('needLogin').classList.remove('hidden');
    } else {
      document.getElementById('app').classList.remove('hidden');
      initTabs();
      loadWallet();
      loadShop();
      document.querySelectorAll('.catbtn').forEach((b) => b.addEventListener('click', () => {
        document.querySelectorAll('.catbtn').forEach((x) => x.className = 'catbtn px-3 py-1.5 rounded bg-neutral-800');
        b.className = 'catbtn px-3 py-1.5 rounded bg-brand-600 text-white';
        cat = b.dataset.cat; loadShop();
      }));
      let t;
      document.getElementById('shopSearch').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(loadShop, 250); });
    }

    function initTabs() {
      document.querySelectorAll('.tabbtn').forEach((b) => b.addEventListener('click', () => {
        document.querySelectorAll('.tabbtn').forEach((x) => x.className = 'tabbtn px-4 py-2 rounded bg-neutral-800');
        b.className = 'tabbtn px-4 py-2 rounded bg-brand-600 text-white';
        document.querySelectorAll('[data-view]').forEach((v) => v.classList.toggle('hidden', v.dataset.view !== b.dataset.tab));
        if (b.dataset.tab === 'inventory') loadInventory();
        if (b.dataset.tab === 'loadout') loadLoadout();
      }));
    }

    async function loadWallet() {
      const w = await api('/api/me/wallet').catch(() => ({ credits: 0, points: 0 }));
      document.getElementById('walCredits').textContent = (w.credits || 0).toLocaleString();
      document.getElementById('walPoints').textContent = (w.points || 0).toLocaleString();
    }

    // ---- shop catalogue ----
    let cat = 'weapon';
    async function loadShop() {
      const q = document.getElementById('shopSearch').value.trim();
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '<p class="text-neutral-500 col-span-full">Loading…</p>';
      const items = await api('/api/shop/catalogue?type=' + cat + '&q=' + encodeURIComponent(q) + '&limit=120').catch(() => []);
      if (!items.length) { grid.innerHTML = '<p class="text-neutral-500 col-span-full">No items found.</p>'; return; }
      grid.innerHTML = items.map((it) => {
        const cheapest = it.prices[0];
        const priceTxt = cheapest ? cheapest.price.toLocaleString() + ' ' + cheapest.currencyName : '';
        return `<div class="glass rounded-xl p-3 flex flex-col">
          ${imgHtml(it.id, it.name)}
          <div class="font-medium text-sm leading-tight">${esc(it.name)}</div>
          <div class="text-xs text-neutral-500 mb-2">${it.levelLock ? 'Lvl ' + it.levelLock + ' · ' : ''}${esc(priceTxt)}</div>
          ${it.owned
            ? '<span class="mt-auto text-center text-xs px-3 py-1.5 rounded bg-neutral-800 text-brand-400">Owned</span>'
            : `<button data-buy="${it.id}" class="mt-auto px-3 py-1.5 rounded bg-brand-600 hover:bg-brand-500 text-white text-sm">Buy</button>`}
        </div>`;
      }).join('');
      const byId = Object.fromEntries(items.map((i) => [i.id, i]));
      grid.querySelectorAll('[data-buy]').forEach((b) => b.onclick = () => openBuy(byId[b.dataset.buy]));
    }

    // ---- buy modal ----
    let buyItem = null;
    function openBuy(it) {
      buyItem = it;
      document.getElementById('buyName').textContent = it.name;
      document.getElementById('buyLock').textContent = it.levelLock ? 'Requires level ' + it.levelLock : '';
      const img = document.getElementById('buyImg'); img.style.display = ''; img.src = '/images/items/' + it.id + '.png';
      document.getElementById('buyMsg').textContent = '';
      document.getElementById('buyPrices').innerHTML = it.prices.map((p) =>
        `<button data-cur="${p.currency}" data-dur="${p.duration}" class="w-full flex justify-between items-center px-3 py-2 rounded bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-sm">
          <span>${p.durationName}</span><span class="font-semibold ${p.currency === 1 ? 'text-brand-400' : 'text-yellow-400'}">${p.price.toLocaleString()} ${p.currencyName}</span>
        </button>`).join('') || '<p class="text-neutral-500 text-sm">Not for sale.</p>';
      document.getElementById('buyPrices').querySelectorAll('[data-cur]').forEach((b) => b.onclick = () => doBuy(+b.dataset.cur, +b.dataset.dur));
      document.getElementById('buyModal').classList.remove('hidden');
    }
    function closeBuy() { document.getElementById('buyModal').classList.add('hidden'); }
    async function doBuy(currency, duration) {
      const msg = document.getElementById('buyMsg');
      msg.className = 'text-sm mt-2 h-5 text-neutral-400'; msg.textContent = 'Purchasing…';
      try {
        await api('/api/shop/buy', { method: 'POST', body: JSON.stringify({ itemId: buyItem.id, currency, duration }) });
        msg.className = 'text-sm mt-2 h-5 text-brand-400'; msg.textContent = 'Purchased!';
        await loadWallet();
        setTimeout(() => { closeBuy(); loadShop(); }, 700);
      } catch (e) { msg.className = 'text-sm mt-2 h-5 text-red-400'; msg.textContent = e.message; }
    }

    // ---- inventory ----
    async function loadInventory() {
      const grid = document.getElementById('invGrid');
      grid.innerHTML = '<p class="text-neutral-500 col-span-full">Loading…</p>';
      const items = await api('/api/shop/inventory').catch(() => []);
      if (!items.length) { grid.innerHTML = '<p class="text-neutral-500 col-span-full">You don\'t own any items yet.</p>'; return; }
      grid.innerHTML = items.map((it) => `<div class="glass rounded-xl p-3 flex flex-col">
        ${imgHtml(it.id, it.name)}
        <div class="font-medium text-sm leading-tight">${esc(it.name)}</div>
        <div class="text-xs text-neutral-500 mb-2 capitalize">${esc(it.type)}${it.expires ? ' · until ' + new Date(it.expires).toLocaleDateString() : ''}</div>
        ${it.equipped
          ? '<span class="mt-auto text-center text-xs px-3 py-1.5 rounded bg-brand-700/40 text-brand-400">Equipped</span>'
          : (it.canEquip ? `<button data-equip="${it.id}" data-class="${it.itemClass}" class="mt-auto px-3 py-1.5 rounded bg-brand-600 hover:bg-brand-500 text-white text-sm">Equip</button>`
                         : '<span class="mt-auto text-center text-xs text-neutral-600">—</span>')}
      </div>`).join('');
      grid.querySelectorAll('[data-equip]').forEach((b) => b.onclick = () => equip(+b.dataset.equip, +b.dataset.class));
    }

    // Item classes that have 3 slots -> ask which one. weapons 2-8, quick 18-20, functional 21-22.
    function multiSlots(cls) {
      if (cls >= 2 && cls <= 8) return ['Weapon 1', 'Weapon 2', 'Weapon 3'];
      if (cls >= 18 && cls <= 20) return ['Quick 1', 'Quick 2', 'Quick 3'];
      if (cls === 21 || cls === 22) return ['Functional 1', 'Functional 2', 'Functional 3'];
      return null;
    }
    async function equip(id, cls) {
      const slots = multiSlots(cls);
      if (slots) { openSlot(id, slots); return; }
      await doEquip(id, 1);
    }
    let slotItem = null;
    function openSlot(id, labels) {
      slotItem = id;
      document.getElementById('slotBtns').innerHTML = labels.map((l, i) =>
        `<button data-slot="${i + 1}" class="w-full px-3 py-2 rounded bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-sm">${l}</button>`).join('');
      document.getElementById('slotBtns').querySelectorAll('[data-slot]').forEach((b) => b.onclick = () => { closeSlot(); doEquip(slotItem, +b.dataset.slot); });
      document.getElementById('slotModal').classList.remove('hidden');
    }
    function closeSlot() { document.getElementById('slotModal').classList.add('hidden'); }
    async function doEquip(id, slot) {
      try { await api('/api/shop/equip', { method: 'POST', body: JSON.stringify({ itemId: id, slot }) }); loadInventory(); }
      catch (e) { alert(e.message); }
    }

    // ---- loadout ----
    const SLOT_LABELS = {
      MeleeWeapon: 'Melee', Weapon1: 'Weapon 1', Weapon2: 'Weapon 2', Weapon3: 'Weapon 3',
      Head: 'Head', Face: 'Face', Gloves: 'Gloves', UpperBody: 'Upper Body', LowerBody: 'Lower Body',
      Boots: 'Boots', Backpack: 'Holo / Pack', QuickItem1: 'Quick 1', QuickItem2: 'Quick 2', QuickItem3: 'Quick 3',
      FunctionalItem1: 'Functional 1', FunctionalItem2: 'Functional 2', FunctionalItem3: 'Functional 3',
    };
    async function loadLoadout() {
      const grid = document.getElementById('loadoutGrid');
      grid.innerHTML = '<p class="text-neutral-500 col-span-full">Loading…</p>';
      const lo = await api('/api/shop/loadout').catch(() => ({}));
      grid.innerHTML = Object.keys(SLOT_LABELS).map((s) => {
        const it = lo[s];
        return `<div class="glass rounded-xl p-3 flex flex-col">
          <div class="text-xs text-neutral-500 mb-1">${SLOT_LABELS[s]}</div>
          ${it ? imgHtml(it.id, it.name) + `<div class="font-medium text-sm leading-tight">${esc(it.name)}</div>
            <button data-unequip="${s}" class="mt-2 px-3 py-1 rounded bg-neutral-800 hover:bg-neutral-700 text-xs">Unequip</button>`
            : '<div class="aspect-square rounded-lg border border-dashed border-neutral-800 flex items-center justify-center text-neutral-700 text-xs">Empty</div>'}
        </div>`;
      }).join('');
      grid.querySelectorAll('[data-unequip]').forEach((b) => b.onclick = async () => { await api('/api/shop/unequip', { method: 'POST', body: JSON.stringify({ slot: b.dataset.unequip }) }).catch(() => {}); loadLoadout(); });
    }
  </script>
  <script src="/assets/nav.js"></script>
</body>
</html>

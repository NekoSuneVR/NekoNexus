<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — NekoNexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857' } } } } };
  </script>
  <style>
    body { background: radial-gradient(1200px 600px at 50% -10%, rgba(16, 185, 129, .14), transparent 60%), #0a0a0a; }
    .glass { background: rgba(23, 23, 23, .7); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="text-neutral-200 min-h-screen">
  <header class="border-b border-neutral-800">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-xl font-bold text-brand-400">NekoNexus</a>
      <nav class="flex gap-5 text-sm text-neutral-400">
        <a href="/" class="hover:text-brand-400">Home</a>
        <a href="/leaderboard" class="hover:text-brand-400">Leaderboard</a>
        <a href="/streams" class="hover:text-brand-400">Streams</a>
        <a href="/admin" class="hover:text-brand-400">Admin</a>
      </nav>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-16">
    <div class="glass rounded-xl p-8 text-center">
      <h1 class="text-2xl font-bold mb-2">Sign in to NekoNexus</h1>
      <div id="content"><p class="text-neutral-500">…</p></div>
    </div>
    <p class="text-center text-neutral-600 text-xs mt-4">Admins: use the <a href="/admin" class="text-brand-400">admin dashboard</a> (username &amp; password).</p>
  </main>

  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const params = new URLSearchParams(location.search);

    // Capture the token handed back after a successful Steam return, then clean the URL.
    if (params.get('token')) {
      localStorage.setItem('nekonexus_user_token', params.get('token'));
      history.replaceState({}, '', '/login');
    }
    if (params.get('error')) {
      document.getElementById('content').innerHTML =
        `<p class="text-red-400 mb-4">Sign-in failed: ${esc(params.get('error'))}</p>
         <a href="/api/auth/steam/login" class="inline-block px-5 py-2 rounded bg-brand-600 hover:bg-brand-500 text-white">Try again with Steam</a>`;
    } else {
      const token = localStorage.getItem('nekonexus_user_token');
      let me = null;
      try { me = token ? JSON.parse(atob(token.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'))) : null; } catch {}
      if (me && (!me.exp || me.exp > Date.now() / 1000)) {
        document.getElementById('content').innerHTML =
          `<p class="text-brand-400 text-lg mb-1">Signed in${me.name ? ' as ' + esc(me.name) : ''} ✓</p>
           <p class="text-neutral-400 text-sm mb-5">Manage your account, view your stats, and report players.</p>
           <div class="flex flex-wrap gap-3 justify-center mb-6">
             <a href="/profile/${me.cmid}" class="px-4 py-2 rounded bg-brand-600 hover:bg-brand-500 text-white text-sm">My profile</a>
             <a href="/leaderboard" class="px-4 py-2 rounded bg-neutral-800 hover:bg-neutral-700 text-sm">Leaderboard</a>
             <button id="logout" class="px-4 py-2 rounded bg-neutral-800 hover:bg-neutral-700 text-sm">Sign out</button>
           </div>
           <div id="payments" class="text-left"></div>`;
        document.getElementById('logout').addEventListener('click', () => { localStorage.removeItem('nekonexus_user_token'); location.reload(); });
        fetch('/api/me/payments', { headers: { Authorization: 'Bearer ' + token } })
          .then((r) => (r.ok ? r.json() : []))
          .then((list) => {
            if (!list || !list.length) return;
            document.getElementById('payments').innerHTML =
              `<h2 class="text-sm font-semibold text-neutral-300 mb-2">Recent purchases</h2>
               <div class="rounded-lg border border-neutral-800 overflow-hidden text-xs">
                 <table class="w-full"><thead class="text-neutral-500 text-left"><tr>
                   <th class="px-3 py-2">Date</th><th class="px-3 py-2">Credits</th><th class="px-3 py-2">Amount</th><th class="px-3 py-2">Status</th><th class="px-3 py-2">Tx</th>
                 </tr></thead><tbody>` +
              list.map((o) => `<tr class="border-t border-neutral-800">
                   <td class="px-3 py-2">${new Date(o.Date).toLocaleDateString()}</td>
                   <td class="px-3 py-2">${(o.Credits || 0).toLocaleString()}</td>
                   <td class="px-3 py-2">${(Number(o.Amount) || 0).toFixed(2)} ${esc(o.Currency || '')}</td>
                   <td class="px-3 py-2"><span class="${o.Status === 'completed' ? 'text-brand-400' : 'text-neutral-400'}">${esc(o.Status || '')}</span></td>
                   <td class="px-3 py-2 font-mono text-neutral-500" title="${esc(o.TxId || '')}">${esc((o.TxId || '').slice(0, 12))}</td></tr>`).join('') +
              `</tbody></table></div>`;
          })
          .catch(() => {});
      } else {
        document.getElementById('content').innerHTML =
          `<p class="text-neutral-400 text-sm mb-5">Sign in with the Steam account you play UberStrike on. We only use this to verify it's you (for reporting players and your profile).</p>
           <a href="/api/auth/steam/login" class="inline-flex items-center gap-2 px-5 py-2.5 rounded bg-[#1b2838] hover:bg-[#2a3f5a] text-white">
             <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12c0 4.3 2.7 8 6.5 9.4l1.4-2a3 3 0 1 0 3-4.9l-2-1.4A4 4 0 1 1 16 12l4-2.8A8 8 0 0 0 12 2z"/></svg>
             Sign in with Steam</a>`;
      }
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leaderboard — NekoNexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857' } } } } };
  </script>
  <style>
    body { background: radial-gradient(1200px 600px at 50% -10%, rgba(16, 185, 129, .14), transparent 60%), #0a0a0a; }
    .glass { background: rgba(23, 23, 23, .7); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="text-neutral-200 min-h-screen">
  <header class="border-b border-neutral-800">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-xl font-bold text-brand-400">NekoNexus</a>
      <nav class="flex gap-5 text-sm text-neutral-400">
        <a href="/" class="hover:text-brand-400">Home</a>
        <a href="/leaderboard" class="text-brand-400">Leaderboard</a>
        <a href="/streams" class="hover:text-brand-400">Streams</a>
        <span id="authnav"><a href="/login" class="hover:text-brand-400">Sign in</a></span>
        <a href="/admin" class="hover:text-brand-400">Admin</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-1">Leaderboard</h1>
    <p class="text-neutral-400 mb-6">The best of NekoNexus. Click a player to view their profile.</p>

    <div class="flex flex-wrap gap-2 mb-4 text-sm items-center">
      <button data-sort="xp" class="sortbtn px-3 py-1 rounded bg-brand-600 text-white">XP</button>
      <button data-sort="level" class="sortbtn px-3 py-1 rounded bg-neutral-800">Level</button>
      <button data-sort="splats" class="sortbtn px-3 py-1 rounded bg-neutral-800">Kills</button>
      <input id="search" type="search" placeholder="Search player name…" class="ml-auto px-3 py-1.5 rounded bg-neutral-900 border border-neutral-700 outline-none focus:border-brand-500 text-sm w-56" />
    </div>

    <div class="grid md:grid-cols-3 gap-6">
      <section class="glass rounded-xl p-4 md:col-span-2">
        <h2 class="font-semibold mb-3">Top Players</h2>
        <table class="w-full text-sm">
          <thead class="text-neutral-500 text-left">
            <tr><th class="py-1 w-10">#</th><th>Player</th><th class="text-right">Level</th><th class="text-right">XP</th><th class="text-right">Kills</th></tr>
          </thead>
          <tbody id="players"><tr><td colspan="5" class="py-4 text-neutral-500">Loading…</td></tr></tbody>
        </table>
      </section>

      <section class="glass rounded-xl p-4">
        <h2 class="font-semibold mb-3">Top Clans</h2>
        <table class="w-full text-sm">
          <thead class="text-neutral-500 text-left">
            <tr><th class="py-1 w-8">#</th><th>Clan</th><th class="text-right">Members</th><th class="text-right">Kills</th></tr>
          </thead>
          <tbody id="clans"><tr><td colspan="4" class="py-4 text-neutral-500">Loading…</td></tr></tbody>
        </table>
      </section>
    </div>
  </main>

  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    let allPlayers = [];
    function renderPlayers() {
      const q = (document.getElementById('search').value || '').trim().toLowerCase();
      const rows = q ? allPlayers.filter((p) => (p.Name || '').toLowerCase().includes(q)) : allPlayers;
      document.getElementById('players').innerHTML = rows.length
        ? rows.map((p) => `<tr class="border-t border-neutral-800">
            <td class="py-1.5 text-neutral-500">${p.rank}</td>
            <td><a class="hover:text-brand-400" href="/profile/${p.Cmid}">${esc(p.Name)}</a></td>
            <td class="text-right">${p.Level ?? 0}</td>
            <td class="text-right">${(p.Xp ?? 0).toLocaleString()}</td>
            <td class="text-right">${(p.Splats ?? 0).toLocaleString()}</td></tr>`).join('')
        : `<tr><td colspan="5" class="py-4 text-neutral-500">${q ? 'No players match “' + esc(q) + '”.' : 'No players yet.'}</td></tr>`;
    }
    async function loadPlayers(sort) {
      allPlayers = await fetch('/api/public/leaderboard?sort=' + sort + '&limit=100').then((x) => x.json()).catch(() => []);
      renderPlayers();
    }
    document.getElementById('search').addEventListener('input', renderPlayers);
    async function loadClans() {
      const r = await fetch('/api/public/clans?limit=25').then((x) => x.json()).catch(() => []);
      document.getElementById('clans').innerHTML = r.length
        ? r.map((c, i) => `<tr class="border-t border-neutral-800">
            <td class="py-1.5 text-neutral-500">${i + 1}</td>
            <td>${c.Tag ? `<span class="text-brand-400">[${esc(c.Tag)}]</span> ` : ''}${esc(c.Name)}</td>
            <td class="text-right">${c.Members ?? 0}</td>
            <td class="text-right">${(c.Kills ?? 0).toLocaleString()}</td></tr>`).join('')
        : '<tr><td colspan="4" class="py-4 text-neutral-500">No clans yet.</td></tr>';
    }
    let sort = 'xp';
    document.querySelectorAll('.sortbtn').forEach((b) => b.addEventListener('click', () => {
      sort = b.dataset.sort;
      document.querySelectorAll('.sortbtn').forEach((x) => x.className = 'sortbtn px-3 py-1 rounded bg-neutral-800');
      b.className = 'sortbtn px-3 py-1 rounded bg-brand-600 text-white';
      loadPlayers(sort);
    }));
    loadPlayers(sort); loadClans();
  </script>
  <script src="/assets/nav.js"></script>
</body>
</html>

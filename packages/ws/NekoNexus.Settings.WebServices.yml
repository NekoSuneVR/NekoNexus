# NekoNexus Web Services

Hostname: '0.0.0.0'

# Port Settings
WebServicePort: 8080
FileServerPort: 8081
SocketPort: 8082

# Database Settings
DatabaseSettings:
  Server: '127.0.0.1'
  Type: 'mysql'
  Port: 3306 # MySQL/MariaDB
  Username: ''
  Password: ''
  DatabaseName: 'nekonexus'

#region Web Service Settings
WebServicePrefix: 'UberStrike.DataCenter.WebService.CWS.'
WebServiceSuffix: 'Contract.svc'
EncryptionInitVector: 'aaaaBBBBccccDDDD' # Must be 16 characters
EncryptionPassPhtase: 'mysupersecretkey'
ServerCredentials:
  # Must match CommApplicationSettings / GameApplicationSettings in NekoNexus.Realtime.yml.
  # Add more entries (Type 3) + matching realtime instances to grow the server list.
  - Name: 'NekoNexus Comm'
    Type: 2 # 2 = Comm, 3 = Game
    Id: '11111111-1111-1111-1111-111111111111'
    Passphrase: 'nekonexus-comm-secret'
  - Name: 'NekoNexus Game'
    Type: 3
    Id: '22222222-2222-2222-2222-222222222222'
    Passphrase: 'nekonexus-game-secret'
PluginBlacklist:
  - MyBlacklistedPlugin.plugin

# File Server Settings
FileServerRoot: 'wwwroot'

# SSL Settings - Obsolete: Use a reverse proxy to provide SSL encryption
EnableSSL: false
SSLCertificateName: ''

# Discord Settings
DiscordSettings:
  Enabled: true
  BotToken: ''
  Integrations:
    LobbyChat: true
    RoomChats: true
    Commands: true
    PlayerJoinAnnouncements: true
    PlayerLeaveAnnouncements: true
    RoomOpenAnnouncements: true
    RoomCloseAnnouncements: true
    RoundStartAnnouncements: true
    RoundEndAnnouncements: true
    ErrorLog: true
  GuildId: ''
  ChatChannelId: ''
  CommandChannelId: ''
  RoomChatCategory: ''
  WebHooks:
    LobbyChat: ''
    PlayerAnnouncements: ''
    RoomAnnouncements: ''
    RoundAnnouncements: ''
    ErrorLog: ''
  AnnouncementBlacklist: # A list of Cmids to not publish any announcements for
    -
# NekoNexus Realtime config. Ready to run as-is for local testing.
# For production: change the GUIDs + passphrases, and make them match the
# ServerCredentials in the web service's NekoNexus.Settings.WebServices.yml.
#
# Override the master host without editing this file:
#   NekoNexus.Realtime.Host Game --master-host 192.168.1.50
#   (or set env PARADISE_MASTER_HOST)

MasterHostname: '127.0.0.1'

WebServicePort: 8080
FileServerPort: 8081
SocketPort: 8082

WebServiceEndpoint: '/2.0'
WebServicePrefix: 'UberStrike.DataCenter.WebService.CWS.'
WebServiceSuffix: 'Contract.svc'
WebServiceUseTLS: false

# ApplicationIdentifier + EncryptionPassPhrase must match a ServerCredentials entry in
# the web service. PhotonId must be non-zero and unique per realtime instance.
CommApplicationSettings:
  ApplicationIdentifier: '11111111-1111-1111-1111-111111111111'
  PhotonId: 1
  EncryptionPassPhrase: 'nekonexus-comm-secret'
  MaxPlayerCount: 100   # default slot count (override with --max-peers)

GameApplicationSettings:
  ApplicationIdentifier: '22222222-2222-2222-2222-222222222222'
  PhotonId: 2
  EncryptionPassPhrase: 'nekonexus-game-secret'
  MaxPlayerCount: 100   # default slot count (override with --max-peers)

EnableChatLog: true

HeartbeatInterval: 5
HeartbeatTimeout: 5
EnableHashVerification: false

CompositeHashes:
  -

JunkHashes:
  -

GameplaySettings:
  MatchCountdownTime: 5
  PlayerRespawnTime: 5
  AllowFriendlyFire: false
  MatchEndTimeout: 3

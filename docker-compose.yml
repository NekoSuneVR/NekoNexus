# Full Paradise stack: MySQL + Bun web services + free LiteNetLib realtime (Comm + Game).
# No Photon SDK, no licence, no CCU cap. Multi-arch (amd64 + arm64) — see docker/README.md.
#
# Quick start (uses the prebuilt images published to GHCR — no source/build needed):
#   docker compose pull
#   docker compose up -d
#
# To BUILD from source instead of pulling, comment out the `image:` line on a service and
# uncomment its `build:` block (you'll need the Core submodule: git submodule update --init packages/Core).
#
# Client connects to:  web services :8080/:8081/:8082, Comm UDP :5055, Game UDP :5155

name: paradise

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: paradise
      MARIADB_USER: paradise
      MARIADB_PASSWORD: paradise
      MARIADB_ROOT_PASSWORD: paradise-root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  webservices:
    image: ghcr.io/nekosunevr/paradise-webservices:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/webservices.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"   # SOAP web service
      - "8081:8081"   # file server
      - "8082:8082"   # realtime <-> master socket
    volumes:
      - ./docker/config/Paradise.Settings.WebServices.yml:/app/packages/ws/Paradise.Settings.WebServices.yml:ro

  realtime-comm:
    image: ghcr.io/nekosunevr/paradise-realtime:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/realtime.Dockerfile
    restart: unless-stopped
    depends_on:
      - webservices
    # The image ships a ready-to-run config; --master-host points it at the webservices
    # container. Add flags, e.g. ["Comm", "--master-host", "webservices", "--max-peers", "200"].
    command: ["Comm", "--master-host", "webservices"]
    ports:
      - "5055:5055/udp"

  realtime-game:
    image: ghcr.io/nekosunevr/paradise-realtime:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/realtime.Dockerfile
    restart: unless-stopped
    depends_on:
      - webservices
    command: ["Game", "--master-host", "webservices"]
    ports:
      - "5155:5155/udp"

  # Admin dashboard (server/player/store management). Open http://<host>:8088 — default
  # login admin/admin; change it on the Account page on first run.
  admin:
    image: ghcr.io/nekosunevr/paradise-admin:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/admin.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMIN_PORT: "8088"
      # Share the stack's DB (same creds as the db service above).
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: paradise
      DB_PASS: paradise
      DB_NAME: paradise
      # CHANGE THIS — keeps admin login tokens valid across restarts and unguessable.
      ADMIN_JWT_SECRET: "change-me-paradise-admin"
      # For NekoPay webhooks, set your public URL here (or in docker/.nekopay.env):
      # PUBLIC_BASE_URL: https://admin.yourdomain.com
    # NekoPay secret (optional). Create docker/.nekopay.env from docker/.nekopay.env.example.
    env_file:
      - path: ./docker/.nekopay.env
        required: false
    ports:
      - "8088:8088"

volumes:
  db-data:

# Full Paradise stack: MySQL + Bun web services + free LiteNetLib realtime (Comm + Game).
# No Photon SDK, no licence, no CCU cap. Multi-arch (amd64 + arm64) — see docker/README.md.
#
# Quick start (uses the prebuilt images published to GHCR — no source/build needed):
#   docker compose pull
#   docker compose up -d
#   # then seed the DB ONCE with the IP players will use to reach this host:
#   PARADISE_PUBLIC_HOST=<your-LAN-or-public-IP> docker compose run --rm seed
#
# PARADISE_PUBLIC_HOST is written into the in-game server list — it MUST be an address the
# player's machine can reach (your LAN IP like 192.168.x.x, your public IP, or a domain).
# 127.0.0.1 only works if the game runs on this same host. Change it later in the admin UI.
#
# To BUILD from source instead of pulling, comment out the `image:` line on a service and
# uncomment its `build:` block (you'll need the Core submodule: git submodule update --init packages/Core).
#
# Client connects to (open/forward these on the host):
#   8080 TCP (web), 8081 TCP (files), 5055 UDP (Comm), 5155 UDP (Game).
#   8082 is realtime<->master only — internal to the compose network, NOT needed by clients.

name: paradise

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: paradise
      MARIADB_USER: paradise
      MARIADB_PASSWORD: paradise
      MARIADB_ROOT_PASSWORD: paradise-root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot DB initializer. Run ONCE after the first `up` — it DROPS + recreates all tables
  # and seeds defaults (app config, shop, maps, the realtime server list, admin user):
  #   PARADISE_PUBLIC_HOST=192.168.1.50 docker compose run --rm seed
  # It does NOT start with `docker compose up` (it's behind the "tools" profile).
  seed:
    image: ghcr.io/nekosunevr/paradise-webservices:latest
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The address PLAYERS use to reach the realtime servers (goes into the server list).
      PARADISE_PUBLIC_HOST: ${PARADISE_PUBLIC_HOST:-127.0.0.1}
    volumes:
      - ./docker/config/Paradise.Settings.WebServices.yml:/app/packages/ws/Paradise.Settings.WebServices.yml:ro
    command: ["bun", "src/index.ts", "seed"]

  webservices:
    image: ghcr.io/nekosunevr/paradise-webservices:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/webservices.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"   # SOAP web service
      - "8081:8081"   # file server
      - "8082:8082"   # realtime <-> master socket
    volumes:
      - ./docker/config/Paradise.Settings.WebServices.yml:/app/packages/ws/Paradise.Settings.WebServices.yml:ro
      # Client auto-updates: publish with misc/publish-update.ps1 (writes ./server-data/updates);
      # the file server serves them at /updates/v2/<channel>/. No image rebuild/restart needed.
      - ./server-data/updates:/app/packages/ws/wwwroot/updates:ro

  realtime-comm:
    image: ghcr.io/nekosunevr/paradise-realtime:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/realtime.Dockerfile
    restart: unless-stopped
    depends_on:
      - webservices
    # The image ships a ready-to-run config; --master-host points it at the webservices
    # container. Add flags, e.g. ["Comm", "--master-host", "webservices", "--max-peers", "200"].
    command: ["Comm", "--master-host", "webservices"]
    ports:
      - "5055:5055/udp"

  realtime-game:
    image: ghcr.io/nekosunevr/paradise-realtime:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/realtime.Dockerfile
    restart: unless-stopped
    depends_on:
      - webservices
    command: ["Game", "--master-host", "webservices"]
    ports:
      - "5155:5155/udp"

  # Admin dashboard (server/player/store management). Open http://<host>:8088 — default
  # login admin/admin; change it on the Account page on first run.
  admin:
    image: ghcr.io/nekosunevr/paradise-admin:latest
    pull_policy: always
    # build:
    #   context: .
    #   dockerfile: docker/admin.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMIN_PORT: "8088"
      # Share the stack's DB (same creds as the db service above).
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: paradise
      DB_PASS: paradise
      DB_NAME: paradise
      # CHANGE THIS — keeps admin login tokens valid across restarts and unguessable.
      ADMIN_JWT_SECRET: "change-me-paradise-admin"
      # For NekoPay webhooks, set your public URL here (or in docker/.nekopay.env):
      # PUBLIC_BASE_URL: https://admin.yourdomain.com
    # NekoPay secret (optional). Create docker/.nekopay.env from docker/.nekopay.env.example.
    env_file:
      - path: ./docker/.nekopay.env
        required: false
    ports:
      - "8088:8088"

volumes:
  db-data:

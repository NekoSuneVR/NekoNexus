# NekoNexus Web Services — Docker config.
# Talks to the "db" service; registers two realtime servers (Comm + Game) whose
# Ids/Passphrases must match docker/config/NekoNexus.Realtime.yml.

Hostname: '0.0.0.0'

WebServicePort: 8080
FileServerPort: 8081
SocketPort: 8082

DatabaseSettings:
  Server: 'db'
  Type: 'mysql'
  Port: 3306
  Username: 'nekonexus'
  Password: 'nekonexus'
  DatabaseName: 'nekonexus'

WebServicePrefix: 'UberStrike.DataCenter.WebService.CWS.'
WebServiceSuffix: 'Contract.svc'
EncryptionInitVector: 'aaaaBBBBccccDDDD' # Must be 16 characters
EncryptionPassPhtase: 'mysupersecretkey'

# The server registry. Add more entries here (and matching realtime instances) to grow
# the in-game server list. Type 2 = Comm, Type 3 = Game.
ServerCredentials:
  - Name: 'NekoNexus Comm'
    Type: 2
    Id: '11111111-1111-1111-1111-111111111111'
    Passphrase: 'nekonexus-comm-secret'
  - Name: 'NekoNexus Game'
    Type: 3
    Id: '22222222-2222-2222-2222-222222222222'
    Passphrase: 'nekonexus-game-secret'

PluginBlacklist:
  -

FileServerRoot: 'wwwroot'

EnableSSL: false
SSLCertificateName: ''

DiscordSettings:
  Enabled: false
  BotToken: ''
  Integrations:
    LobbyChat: false
    RoomChats: false
    Commands: false
    PlayerJoinAnnouncements: false
    PlayerLeaveAnnouncements: false
    RoomOpenAnnouncements: false
    RoomCloseAnnouncements: false
    RoundStartAnnouncements: false
    RoundEndAnnouncements: false
    ErrorLog: false
  GuildId: ''
  ChatChannelId: ''
  CommandChannelId: ''
  RoomChatCategory: ''
  WebHooks:
    LobbyChat: ''
    PlayerAnnouncements: ''
    RoomAnnouncements: ''
    RoundAnnouncements: ''
    ErrorLog: ''
  AnnouncementBlacklist:
    -

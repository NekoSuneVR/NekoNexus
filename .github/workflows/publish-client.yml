name: Publish client update (cloud)

# Builds the NekoNexus client mod and publishes the in-game auto-update channel to the `updates`
# branch (served by GitHub Pages). Runs on GitHub-hosted runners.
#
# GAME REFS: the mod only compiles against the real UberStrike game assemblies (Assembly-CSharp.dll
# etc.), which are proprietary and must NOT live in this public repo. They're kept in the PRIVATE
# repo NekoSuneVR/uberstrike-refs and pulled here via a read-only deploy key (secret
# GAME_REFS_DEPLOY_KEY). To update them: push new DLLs to uberstrike-refs - no change here needed.
#
# Also: Settings -> Pages -> Deploy from a branch -> `updates` / root.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish
        type: choice
        options: [all, beta, stable]
        default: all
  push:
    branches: [dev]
    paths:
      - 'packages/Client/**'
      - 'shims/**'
      - 'client-assets/**'
      - 'misc/publish-update.ps1'

permissions:
  contents: write   # force-push the `updates` branch

concurrency:
  group: publish-client
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: oven-sh/setup-bun@v2

      # Pull the proprietary game refs from the PRIVATE companion repo via a read-only deploy key
      # (secret GAME_REFS_DEPLOY_KEY). They never live in this public repo.
      - name: Fetch game reference assemblies (private)
        uses: actions/checkout@v4
        with:
          repository: NekoSuneVR/uberstrike-refs
          ssh-key: ${{ secrets.GAME_REFS_DEPLOY_KEY }}
          path: .game-refs

      - name: Stage game reference assemblies
        shell: pwsh
        run: |
          $refDir = "packages/AssemblyReferences/4.7.1"
          New-Item -ItemType Directory -Force -Path $refDir | Out-Null
          Copy-Item ".game-refs/*.dll" $refDir -Force
          foreach ($d in 'Assembly-CSharp.dll','Assembly-CSharp-firstpass.dll','Photon3Unity3D.dll','UnityEngine.dll') {
            if (-not (Test-Path (Join-Path $refDir $d))) { throw "Game ref $d missing from the uberstrike-refs repo." }
          }
          Get-ChildItem $refDir -Filter *.dll | ForEach-Object { Write-Host "  + $($_.Name)" }

      - name: Install workspace deps
        run: bun install

      - name: Build mod + publish update channel
        shell: pwsh
        run: ./misc/publish-update.ps1 -Channel ${{ github.event.inputs.channel || 'all' }} -Push

      - name: Summary
        shell: pwsh
        run: |
          Write-Host "Published channel(s): ${{ github.event.inputs.channel || 'all' }}"
          Write-Host "Update catalog (GitHub Pages): https://<user>.github.io/<repo>/v2/<channel>/updates.yml"

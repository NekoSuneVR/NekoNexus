name: Publish client update (cloud)

# Builds the NekoNexus client mod and publishes the in-game auto-update channel to the `updates`
# branch (served by GitHub Pages). Runs on GitHub-hosted runners.
#
# THE ONE SECRET YOU MUST SET: the mod only compiles against the real UberStrike game assemblies
# (Assembly-CSharp.dll etc.), which are proprietary and must NOT live in the repo. Instead, host a
# zip of them somewhere private and put its direct-download URL in the repo secret GAME_REFS_URL:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  GAME_REFS_URL
#     Value: https://<your-private-host>/uberstrike-refs.zip
#   The zip must contain (from your UberStrike_Data\Managed):
#     Assembly-CSharp.dll, Assembly-CSharp-firstpass.dll, Photon3Unity3D.dll, UnityEngine.dll
#   (Put it behind an unguessable URL / token on your own server, a private release asset, etc.)
#
# Also: Settings -> Pages -> Deploy from a branch -> `updates` / root.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish
        type: choice
        options: [all, beta, stable]
        default: all
  push:
    branches: [dev]
    paths:
      - 'packages/Client/**'
      - 'shims/**'

permissions:
  contents: write   # force-push the `updates` branch

concurrency:
  group: publish-client
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: oven-sh/setup-bun@v2

      - name: Fetch game reference assemblies
        shell: pwsh
        env:
          GAME_REFS_URL: ${{ secrets.GAME_REFS_URL }}
        run: |
          if (-not $env:GAME_REFS_URL) {
            throw "Repo secret GAME_REFS_URL is not set. Point it at a private zip of Assembly-CSharp.dll, Assembly-CSharp-firstpass.dll, Photon3Unity3D.dll, UnityEngine.dll (see the comment at the top of this workflow). The mod cannot compile without the game refs."
          }
          $refDir = "packages/AssemblyReferences/4.7.1"
          New-Item -ItemType Directory -Force -Path $refDir | Out-Null
          Invoke-WebRequest -Uri $env:GAME_REFS_URL -OutFile refs.zip
          Expand-Archive -Path refs.zip -DestinationPath $refDir -Force
          # Flatten in case the zip has a top-level folder.
          Get-ChildItem -Path $refDir -Recurse -Filter *.dll | Where-Object { $_.DirectoryName -ne (Resolve-Path $refDir).Path } | ForEach-Object { Move-Item $_.FullName $refDir -Force }
          foreach ($d in 'Assembly-CSharp.dll','Photon3Unity3D.dll','UnityEngine.dll') {
            if (-not (Test-Path (Join-Path $refDir $d))) { throw "Game ref $d missing from the GAME_REFS_URL zip." }
          }
          Get-ChildItem $refDir -Filter *.dll | ForEach-Object { Write-Host "  + $($_.Name)" }

      - name: Install workspace deps
        run: bun install

      - name: Build mod + publish update channel
        shell: pwsh
        run: ./misc/publish-update.ps1 -Channel ${{ github.event.inputs.channel || 'all' }} -Push

      - name: Summary
        shell: pwsh
        run: |
          Write-Host "Published channel(s): ${{ github.event.inputs.channel || 'all' }}"
          Write-Host "Update catalog (GitHub Pages): https://<user>.github.io/<repo>/v2/<channel>/updates.yml"

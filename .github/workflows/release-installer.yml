name: Release installer (cloud, on tag)

# Builds the one-click patcher installer (NekoNexusSetup.exe) + the self-contained client-patch zip
# on a GitHub-hosted runner and attaches them to the GitHub Release for the version tag (v*). Also
# publishes that build to the update channel so the tagged version is what players auto-update to.
#
# Needs the GAME_REFS_URL repo secret (a private zip of the UberStrike game DLLs) - same as
# publish-client.yml; see the comment at the top of that workflow. Everything else (Inno Setup,
# patcher, .NET, Bun) is installed on the runner below.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build + attach the installer to (e.g. v4.7.3)
        required: true

permissions:
  contents: write   # create/append the GitHub Release + force-push the updates branch

concurrency:
  group: publish-client   # serialize with publish-client.yml so they don't both touch the updates branch
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: oven-sh/setup-bun@v2
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Fetch game reference assemblies
        shell: pwsh
        env:
          GAME_REFS_URL: ${{ secrets.GAME_REFS_URL }}
        run: |
          if (-not $env:GAME_REFS_URL) {
            throw "Repo secret GAME_REFS_URL is not set. Point it at a private zip of Assembly-CSharp.dll, Assembly-CSharp-firstpass.dll, Photon3Unity3D.dll, UnityEngine.dll. The mod cannot compile without the game refs."
          }
          $refDir = "packages/AssemblyReferences/4.7.1"
          New-Item -ItemType Directory -Force -Path $refDir | Out-Null
          Invoke-WebRequest -Uri $env:GAME_REFS_URL -OutFile refs.zip
          Expand-Archive -Path refs.zip -DestinationPath $refDir -Force
          Get-ChildItem -Path $refDir -Recurse -Filter *.dll | Where-Object { $_.DirectoryName -ne (Resolve-Path $refDir).Path } | ForEach-Object { Move-Item $_.FullName $refDir -Force }
          foreach ($d in 'Assembly-CSharp.dll','Photon3Unity3D.dll','UnityEngine.dll') {
            if (-not (Test-Path (Join-Path $refDir $d))) { throw "Game ref $d missing from the GAME_REFS_URL zip." }
          }
          Get-ChildItem $refDir -Filter *.dll | ForEach-Object { Write-Host "  + $($_.Name)" }

      - name: Install workspace deps
        run: bun install

      - name: Ensure patcher submodule
        shell: pwsh
        run: |
          if (-not (Test-Path packages/Patcher/UniversalUnityPatcher.csproj)) {
            git clone --depth 1 https://github.com/festivaldev/UniversalUnityPatcher packages/Patcher
          }

      - name: Build patcher (UniversalUnityPatcher)
        run: |
          nuget restore packages/Patcher/UniversalUnityPatcher.sln
          msbuild packages/Patcher/UniversalUnityPatcher.sln /p:Configuration=Release

      # Builds mod + shim + bootstrap + RPC, stages both channels, regenerates manifests, rebuilds
      # NekoNexusSetup.exe (-RefreshInstaller), and publishes the channel + installer to the
      # `updates` branch (-Push) so the tagged build is the live auto-update too.
      - name: Build installer + publish channel
        shell: pwsh
        run: ./misc/publish-update.ps1 -Channel all -RefreshInstaller -Push

      - name: Verify installer built
        shell: pwsh
        run: |
          $exe = ".release/installer/NekoNexusSetup.exe"
          if (-not (Test-Path $exe)) { throw "NekoNexusSetup.exe not found at $exe - did the Inno Setup build fail?" }
          Write-Host "installer: $((Get-Item $exe).Length) bytes"

      - name: Attach installer + client patch to the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            .release/installer/NekoNexusSetup.exe
            .release/client/NekoNexus-free-server-client.zip

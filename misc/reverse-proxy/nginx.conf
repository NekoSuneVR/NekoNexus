# One-domain reverse proxy for Paradise (nginx). Add your TLS certs and domain.
# Puts the HTTP ports (web 8080, files 8081, admin 8088) behind one HTTPS domain.
#
# IMPORTANT: this proxy carries HTTP only. The realtime game servers (Comm 5055/udp,
# Game 5155/udp) are RAW UDP and CANNOT go through nginx — the game connects to them
# directly. So the in-game server list (PhotonServers.IP) must be your public IP/domain
# and UDP 5055/5155 must be open directly on the host. The master socket 8082 stays internal.
#
# Use a VALID TLS cert (Let's Encrypt / Cloudflare). A self-signed cert makes the Unity/Mono
# game client refuse the connection ("can't read data").
#
# Client points at:  https://paradise.example.com  (with /2.0, /images, /updates under it)

server {
    listen 443 ssl;
    server_name paradise.example.com;

    ssl_certificate     /etc/ssl/paradise/fullchain.pem;
    ssl_certificate_key /etc/ssl/paradise/privkey.pem;

    client_max_body_size 50m;   # SOAP bodies / icon payloads can be large

    # Applied to all locations below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # SOAP web service under /2.0
    location /2.0/ {
        proxy_pass http://127.0.0.1:8080/2.0/;
    }

    # Game file server: images + updates ONLY. These are the only paths the game client fetches
    # from 8081; everything else under the domain is the website (served by the admin app, 8088).
    location /images/  { proxy_pass http://127.0.0.1:8081/images/; }
    location /updates/ { proxy_pass http://127.0.0.1:8081/updates/; }

    # Admin dashboard + its API (same backend, 8088). Lock down /admin/ at the network level too.
    location /admin/ { proxy_pass http://127.0.0.1:8088/; }
    location /api/   { proxy_pass http://127.0.0.1:8088/api/; }
    # Public web store opened by the in-game "Get Credits" button (+ NekoPay return pages).
    location /store  { proxy_pass http://127.0.0.1:8088/store; }
    location /pay/   { proxy_pass http://127.0.0.1:8088/pay/; }

    # Public website: homepage + leaderboard, player profiles, live streams, and Steam sign-in are
    # all served by the admin app (8088). Steam OpenID return + report submission ride on /api/
    # above. So the default location points at the admin app, NOT the file server. (The game never
    # requests "/", only the explicit /2.0, /images, /updates paths above.)
    #   /            -> homepage
    #   /leaderboard -> player + clan leaderboard
    #   /profile/ID  -> public player profile (+ report button for signed-in users)
    #   /streams     -> live Twitch streamers playing UberStrike
    #   /login       -> Steam sign-in for normal users
    location / {
        proxy_pass http://127.0.0.1:8088/;
    }
}

server {
    listen 80;
    server_name paradise.example.com;
    return 301 https://$host$request_uri;
}
